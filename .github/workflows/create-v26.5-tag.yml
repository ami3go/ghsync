name: Publish v26.5 release

on:
  push:
    branches:
      - chore/create-v26.5-tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v26.5 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v26.5 >/dev/null 2>&1; then
            echo "v26.5 release already exists"
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          Known-good GitHub Sync baseline with the repository action UI restored.

          Highlights:
          - Pull remains visible on repository rows.
          - Secondary repository actions use the working three-dot menu.
          - Third-party repository actions retain the corresponding Pull/Clone and menu behavior.
          - This release is the baseline for subsequent styling and feature work.

          Tag commit: ad2d4a704de9b09cf8222f0a532e0c1705835b3d
          EOF
          gh release create v26.5 --title "v26.5" --notes-file release-notes.md
