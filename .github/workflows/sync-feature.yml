name: Sync feature

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-ui:
    name: Repository Sync DOM test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jsdom
        run: npm install --no-save jsdom
      - name: Test Sync tab and manifest assignment
        run: node test/repository-list-feature-test.js
