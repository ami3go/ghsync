name: Priority 1 Cockpit features

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  priority-one-ui:
    name: Sync, Fleet and Attention DOM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jsdom
        run: npm install --no-save jsdom
      - name: Test Sync tab and manifest assignment
        run: node test/repository-list-feature-test.js
      - name: Test first-time Sync repository setup
        run: node test/sync-bootstrap-feature-test.js
      - name: Test Fleet machines view
        run: node test/machines-feature-test.js
      - name: Test Attention dashboard
        run: node test/attention-feature-test.js
