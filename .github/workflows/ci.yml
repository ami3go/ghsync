name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint shell, JS and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck bin/ghsync bin/ghsync-thirdparty install.sh

      - name: bash syntax
        run: bash -n bin/ghsync && bash -n bin/ghsync-thirdparty && bash -n install.sh

      - name: JavaScript syntax
        run: |
          set -e
          for f in cockpit/*.js test/*.js; do
            node --check "$f"
          done

      - name: Cockpit JSON is valid
        run: |
          python3 -m json.tool cockpit/manifest.json > /dev/null
          python3 -m json.tool cockpit/repo-features.json > /dev/null

      - name: Repository feature manifest is complete
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('cockpit')
          names = json.loads((root / 'repo-features.json').read_text())
          assert names, 'feature manifest is empty'
          assert len(names) == len(set(names)), 'duplicate feature entries'
          assert names[0] == 'repo-feature-release.js', 'release marker must load first'
          assert 'repo-feature-core-helpers.js' in names, 'shared bulk-action helpers must be loaded'
          assert names.index('repo-feature-core-helpers.js') < names.index('repo-feature-check-updates.js')
          assert names[-1] == 'repo-feature-thirdparty-menu.js', 'third-party compaction must load last'
          missing = [name for name in names if not (root / name).is_file()]
          assert not missing, f'missing feature files: {missing}'
          unexpected = sorted(p.name for p in root.glob('repo-feature-*.js') if p.name not in names)
          assert not unexpected, f'feature files missing from manifest: {unexpected}'
          PY

      - name: Repository manager safety checks
        run: |
          grep -q 'VERSION="26.4"' bin/ghsync
          grep -q 'var version = "26.4"' cockpit/repo-feature-release.js
          grep -q '<title>GitHub Sync 26.4</title>' cockpit/index.html
          grep -q '>GitHub Sync 26.4</h1>' cockpit/index.html
          ! grep -Eq -- '--force|--force-with-lease' cockpit/repo-feature-push.js
          ! grep -Eq -- 'branch.*-D' cockpit/repo-feature-branches.js
          grep -q 'check-ref-format' cockpit/repo-feature-branches.js
          grep -q 'DISCARD ' cockpit/repo-feature-local-changes.js
          grep -q 'bundle create' cockpit/repo-feature-backup.js
          grep -q 'git apply --index' cockpit/repo-feature-backup.js
          grep -q 'diff.*--cached.*--name-only.*--no-renames.*-z' cockpit/repo-feature-commit-selected.js
          grep -q 'fsck' cockpit/repo-feature-maintenance.js
          grep -q 'automatic' cockpit/repo-feature-policy.js
          grep -q 'third_party_repos' bin/ghsync
          grep -q 'managed_repos' bin/ghsync

      - name: Cockpit page DOM tests
        run: |
          npm install --no-save jsdom
          node test/ui-test.js
          node test/row-actions-test.js

  install:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install for the runner user
        run: bash ./install.sh

      - name: Command and Cockpit page are in place
        run: |
          test -x "$HOME/.local/bin/ghsync"
          test -x "$HOME/.local/bin/ghsync-thirdparty"
          test -f "$HOME/.local/share/cockpit/ghsync/manifest.json"
          test -x "$HOME/.local/share/cockpit/ghsync/ghsync"
          test -x "$HOME/.local/share/cockpit/ghsync/ghsync-thirdparty"
          test -f "$HOME/.local/share/cockpit/ghsync/thirdparty.js"
          test -f "$HOME/.local/share/cockpit/ghsync/repo-features.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('cockpit')
          installed = Path.home() / '.local/share/cockpit/ghsync'
          for name in json.loads((source / 'repo-features.json').read_text()):
              assert (installed / name).is_file(), f'installer omitted {name}'
          PY

      - name: Script runs without gh configured
        run: |
          "$HOME/.local/bin/ghsync" --help | grep -q 'ghsync 26.4'
          "$HOME/.local/bin/ghsync" config
          "$HOME/.local/bin/ghsync" check
          "$HOME/.local/bin/ghsync-thirdparty" --help

      - name: Clone, pull, commit and status against a local fixture
        run: |
          set -e
          git config --global user.email ci@example.com
          git config --global user.name CI
          git config --global init.defaultBranch main
          mkdir -p /tmp/fixture/acme
          git init -q --bare /tmp/remote.git
          git clone -q /tmp/remote.git /tmp/work
          cd /tmp/work && echo hello > file.txt && git add . && git commit -qm first && git push -q origin main
          git clone -q /tmp/remote.git /tmp/fixture/acme/demo
          cd /tmp/work && echo again >> file.txt && git commit -qam second && git push -q origin main
          GHSYNC_ROOT=/tmp/fixture "$HOME/.local/bin/ghsync" pull --porcelain | tee /tmp/out
          grep -q '^updated' /tmp/out

          echo local >> /tmp/fixture/acme/demo/file.txt
          GHSYNC_ROOT=/tmp/fixture "$HOME/.local/bin/ghsync" commit acme/demo "local change" --porcelain | tee /tmp/commit-out
          grep -q '^committed' /tmp/commit-out
          test -z "$(git -C /tmp/fixture/acme/demo status --porcelain)"
          test "$(git -C /tmp/fixture/acme/demo log -1 --format=%s)" = "local change"
          test "$(git -C /tmp/fixture/acme/demo rev-parse HEAD)" != "$(git --git-dir=/tmp/remote.git rev-parse main)"

      - name: Track and manage a third-party repository
        run: |
          set -e
          export XDG_CONFIG_HOME=/tmp/ghsync-config
          export GHSYNC_ROOT=/tmp/fixture
          mkdir -p /tmp/public/vendor
          git init -q --bare /tmp/public/vendor/widget.git
          git clone -q /tmp/public/vendor/widget.git /tmp/vendor-work
          cd /tmp/vendor-work
          echo first > vendor.txt
          git add vendor.txt
          git commit -qm first
          git push -q origin main

          "$HOME/.local/bin/ghsync-thirdparty" add file:///tmp/public/vendor/widget.git --porcelain | tee /tmp/third-add
          grep -q $'^tracked\tvendor/widget\t' /tmp/third-add
          test -d /tmp/fixture/vendor/widget/.git

          "$HOME/.local/bin/ghsync-thirdparty" list --porcelain | tee /tmp/third-list
          grep -q $'^third-party\tvendor/widget\t.*\tcloned$' /tmp/third-list

          # Credential/query-bearing public URLs must be rejected before network access.
          ! "$HOME/.local/bin/ghsync-thirdparty" add 'https://user:token@example.invalid/vendor/secret.git' >/tmp/secret-userinfo 2>&1
          ! grep -q 'token' /tmp/secret-userinfo
          ! "$HOME/.local/bin/ghsync-thirdparty" add 'https://example.invalid/vendor/secret.git?token=secret' >/tmp/secret-query 2>&1
          ! grep -q 'token=secret' /tmp/secret-query

          cd /tmp/vendor-work
          echo second >> vendor.txt
          git commit -qam second
          git push -q origin main
          "$HOME/.local/bin/ghsync" pull vendor/widget --porcelain | tee /tmp/third-pull
          grep -q '^updated' /tmp/third-pull
          test "$(git -C /tmp/fixture/vendor/widget log -1 --format=%s)" = second

          # Core clone/orphan handling must include the third-party registry.
          mkdir -p /tmp/fakebin
          cat >/tmp/fakebin/gh <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-} ${2:-}" == "auth status" ]]; then exit 0; fi
          if [[ "${1:-} ${2:-}" == "repo list" ]]; then exit 0; fi
          if [[ "${1:-} ${2:-}" == "api user" ]]; then printf 'ci\n'; exit 0; fi
          exit 1
          EOF
          chmod +x /tmp/fakebin/gh

          PATH="/tmp/fakebin:$PATH" "$HOME/.local/bin/ghsync" orphans --porcelain | tee /tmp/orphans
          ! grep -q $'^orphan\tvendor/widget\t' /tmp/orphans

          rm -rf /tmp/fixture/vendor/widget
          PATH="/tmp/fakebin:$PATH" "$HOME/.local/bin/ghsync" clone --porcelain | tee /tmp/reclone
          grep -q $'^cloned\tvendor/widget\t' /tmp/reclone
          test -d /tmp/fixture/vendor/widget/.git

          "$HOME/.local/bin/ghsync-thirdparty" remove vendor/widget --porcelain | tee /tmp/third-remove
          grep -q $'^untracked\tvendor/widget\t' /tmp/third-remove
          test -d /tmp/fixture/vendor/widget/.git
          test -z "$("$HOME/.local/bin/ghsync-thirdparty" list --porcelain)"

      - name: Uninstall cleanly
        run: |
          bash ./install.sh --uninstall
          test ! -e "$HOME/.local/bin/ghsync"
          test ! -e "$HOME/.local/bin/ghsync-thirdparty"
